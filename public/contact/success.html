<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>送信完了 - 神戸リージェンシー行政書士事務所</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800">
    <div class="min-h-screen">
        <!-- Header -->
        <header class="bg-white shadow-sm">
            <div class="container mx-auto px-4 py-4">
                <div class="flex items-center justify-between">
                    <h1 class="text-xl font-bold text-slate-900">送信完了</h1>
                    <a href="/" class="text-blue-600 hover:text-blue-800 font-medium">
                        ← トップページに戻る
                    </a>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="container mx-auto px-4 py-16">
            <div class="max-w-2xl mx-auto">
                <div class="text-center">
                    <div class="w-16 h-16 mx-auto mb-6 bg-green-100 rounded-full flex items-center justify-center">
                        <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                        </svg>
                    </div>
                    
                    <h2 class="text-3xl md:text-4xl font-extrabold tracking-tight mb-4 text-slate-900">
                        お問い合わせありがとうございます
                    </h2>
                    
                    <p class="text-lg text-slate-600 mb-6">
                        送信が完了しました。担当者より24時間以内にご連絡いたします。
                    </p>
                    
                    <div class="bg-blue-50 border border-blue-200 rounded-lg p-6 mb-8">
                        <h3 class="font-semibold text-blue-900 mb-2">次のステップ</h3>
                        <ul class="text-sm text-blue-800 text-left space-y-1">
                            <li>• 担当者より24時間以内にメールまたはお電話にてご連絡いたします</li>
                            <li>• ご相談内容に応じて、オンライン面談の日程を調整いたします</li>
                            <li>• 必要に応じて、追加の資料をお送りいたします</li>
                        </ul>
                    </div>
                    
                    <div class="flex flex-col sm:flex-row gap-4 justify-center">
                        <a 
                            href="/" 
                            class="px-6 py-3 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 transition-colors"
                        >
                            トップページに戻る
                        </a>
                        <a 
                            href="/contact" 
                            class="px-6 py-3 border border-slate-300 text-slate-700 font-semibold rounded-lg hover:bg-slate-50 transition-colors"
                        >
                            別の内容で問い合わせる
                        </a>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
