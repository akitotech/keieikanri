<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netlify Forms テスト</title>
</head>
<body>
    <h1>Netlify Forms テスト</h1>
    
    <form name="test-contact" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" data-netlify-redirect="/contact/success">
        <input type="hidden" name="form-name" value="test-contact" />
        <div style="display: none;">
            <label>Don't fill this out if you're human: <input name="bot-field" /></label>
        </div>
        
        <div>
            <label for="name">お名前:</label>
            <input type="text" id="name" name="name" required>
        </div>
        
        <div>
            <label for="email">メールアドレス:</label>
            <input type="email" id="email" name="email" required>
        </div>
        
        <div>
            <label for="message">メッセージ:</label>
            <textarea id="message" name="message" required></textarea>
        </div>
        
        <button type="submit">送信</button>
    </form>
</body>
</html>
