<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>無料相談のお申込み - 神戸リージェンシー行政書士事務所</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800">
    <div class="min-h-screen">
        <!-- Header -->
        <header class="bg-white shadow-sm">
            <div class="container mx-auto px-4 py-4">
                <div class="flex items-center justify-between">
                    <h1 class="text-xl font-bold text-slate-900">無料相談のお申込み</h1>
                    <a href="/" class="text-blue-600 hover:text-blue-800 font-medium">
                        ← トップページに戻る
                    </a>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="container mx-auto px-4 py-16">
            <div class="max-w-2xl mx-auto">
                <!-- Title Section -->
                <div class="text-center mb-8">
                    <h2 class="text-3xl md:text-4xl font-extrabold tracking-tight mb-4">
                        無料相談のお申込み
                    </h2>
                    <p class="text-lg text-slate-600 mb-2">
                        日本語でのZoom面談（<strong>限定3社</strong>、<strong>9/14(日)締切</strong>）をご希望の方は下記フォームよりお申し込みください。
                    </p>
                    <p class="text-sm text-slate-500">
                        ※送信後、担当者より24時間以内にご連絡いたします。
                    </p>
                </div>

                <!-- Contact Form -->
                <div class="bg-white rounded-2xl shadow-lg p-8">
                    <form 
                        name="contact" 
                        method="POST" 
                        data-netlify="true"
                        data-netlify-honeypot="bot-field"
                        data-netlify-redirect="/contact/success"
                        class="grid gap-6"
                    >
                        <!-- Netlify Forms用の隠しフィールド -->
                        <input type="hidden" name="form-name" value="contact" />
                        <div style="display: none;">
                            <label>
                                Don't fill this out if you're human: <input name="bot-field" />
                            </label>
                        </div>

                        <!-- Family Name Field -->
                        <div>
                            <label for="familyName" class="block text-sm font-medium text-slate-700 mb-2">
                                姓（ファミリーネーム） <span class="text-red-500">*</span>
                            </label>
                            <input 
                                type="text" 
                                id="familyName"
                                name="familyName" 
                                placeholder="山田" 
                                required 
                                class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors" 
                            />
                        </div>

                        <!-- First Name Field -->
                        <div>
                            <label for="firstName" class="block text-sm font-medium text-slate-700 mb-2">
                                名（ファーストネーム） <span class="text-red-500">*</span>
                            </label>
                            <input 
                                type="text" 
                                id="firstName"
                                name="firstName" 
                                placeholder="太郎" 
                                required 
                                class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors" 
                            />
                        </div>

                        <!-- Email Field -->
                        <div>
                            <label for="email" class="block text-sm font-medium text-slate-700 mb-2">
                                メールアドレス <span class="text-red-500">*</span>
                            </label>
                            <input 
                                type="email" 
                                id="email"
                                name="email" 
                                placeholder="yamada@example.com" 
                                required 
                                class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors" 
                            />
                        </div>

                        <!-- Nationality Field -->
                        <div>
                            <label for="nationality" class="block text-sm font-medium text-slate-700 mb-2">
                                国籍 <span class="text-red-500">*</span>
                            </label>
                            <input 
                                type="text" 
                                id="nationality"
                                name="nationality" 
                                placeholder="例：日本、中国、韓国、アメリカなど" 
                                required
                                class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors" 
                            />
                        </div>

                        <!-- Company Field -->
                        <div>
                            <label for="company" class="block text-sm font-medium text-slate-700 mb-2">
                                会社名・事業名 <span class="text-red-500">*</span>
                            </label>
                            <input 
                                type="text" 
                                id="company"
                                name="company" 
                                placeholder="株式会社サンプル" 
                                required
                                class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors" 
                            />
                        </div>

                        <!-- Business Content Field -->
                        <div>
                            <label for="businessContent" class="block text-sm font-medium text-slate-700 mb-2">
                                事業内容 <span class="text-red-500">*</span>
                            </label>
                            <textarea 
                                id="businessContent"
                                name="businessContent" 
                                rows="6" 
                                placeholder="事業内容について詳しくお書きください。例：ITコンサルティング、貿易業、飲食店経営、不動産投資、教育事業など" 
                                required 
                                class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors resize-vertical" 
                            ></textarea>
                        </div>

                        <!-- Submit Button -->
                        <div class="pt-4">
                            <button 
                                type="submit" 
                                class="w-full px-6 py-4 rounded-xl bg-blue-600 text-white font-semibold hover:bg-blue-700 focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors text-lg"
                            >
                                無料相談を申し込む
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
