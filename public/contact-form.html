<!DOCTYPE html>
<html>
<head>
    <title>Contact Form</title>
</head>
<body>
    <form name="contact" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" data-netlify-redirect="/contact/success">
        <input type="hidden" name="form-name" value="contact" />
        <div style="display: none;">
            <label>Don't fill this out if you're human: <input name="bot-field" /></label>
        </div>
        
        <p>
            <label>姓（ファミリーネーム）: <input type="text" name="familyName" required /></label>
        </p>
        <p>
            <label>名（ファーストネーム）: <input type="text" name="firstName" required /></label>
        </p>
        <p>
            <label>メールアドレス: <input type="email" name="email" required /></label>
        </p>
        <p>
            <label>国籍: <input type="text" name="nationality" required /></label>
        </p>
        <p>
            <label>会社名・事業名: <input type="text" name="company" required /></label>
        </p>
        <p>
            <label>事業内容: <textarea name="businessContent" required></textarea></label>
        </p>
        <p>
            <button type="submit">無料相談を申し込む</button>
        </p>
    </form>
</body>
</html>
